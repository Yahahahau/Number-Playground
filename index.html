<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#0b1a2e" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <title>Number Playground</title>
    <script type="module" crossorigin src="./assets/index-WsQkBGF2.js"></script>
    <link rel="stylesheet" crossorigin href="./assets/index-DZnvHAiE.css">
  </head>
  <body>
    <div id="app">
      <canvas id="game"></canvas>
      <div id="ui"></div>
    </div>

    <div id="loading">
      <div class="loading-inner">
        <div class="loading-cubes"><span>1</span><span>1</span></div>
        <div class="loading-title">Number Playground</div>
        <div class="loading-sub" id="loading-sub">Loading physics…</div>
      </div>
    </div>

    <div id="rotate-overlay">
      <div class="rotate-inner">
        <div class="rotate-icon">⟳</div>
        <div class="rotate-title">Please rotate your phone</div>
        <div class="rotate-sub">Number Playground is played in portrait mode.</div>
      </div>
    </div>

    <div id="fatal" hidden>
      <div class="fatal-inner">
        <div class="fatal-title">Something went wrong</div>
        <div class="fatal-msg" id="fatal-msg"></div>
        <button id="fatal-reload" type="button">Reload</button>
      </div>
    </div>

  </body>
</html>
